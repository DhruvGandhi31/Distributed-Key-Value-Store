apiVersion: v1
kind: Namespace
metadata:
  name: kvstore

---
# Headless service: no cluster IP, just DNS records for each pod
# (kvstore-0.kvstore-headless, kvstore-1.kvstore-headless, ...). This is
# what gives Raft peers stable addresses that survive pod restarts.
apiVersion: v1
kind: Service
metadata:
  name: kvstore-headless
  namespace: kvstore
spec:
  clusterIP: None
  selector:
    app: kvstore
  ports:
    - name: raft
      port: 7000
    - name: client
      port: 8000

---
# Client-facing services — one per pod, not one shared LoadBalancer in
# front of all three. A single shared LB would spread requests across all
# 3 pods, and a request landing on a follower would get redirected via
# X-Leader-URL to an internal-only headless-service address the outside
# world can't resolve. Each pod gets its own externally reachable address
# instead (mirrors the 3 separate host ports Docker Compose used), and
# --client-peers below advertises exactly these addresses so a redirect
# always points somewhere the caller can actually reach.
apiVersion: v1
kind: Service
metadata:
  name: kvstore-0-client
  namespace: kvstore
spec:
  type: LoadBalancer
  selector:
    statefulset.kubernetes.io/pod-name: kvstore-0
  ports:
    - name: client
      port: 8081
      targetPort: 8000

---
apiVersion: v1
kind: Service
metadata:
  name: kvstore-1-client
  namespace: kvstore
spec:
  type: LoadBalancer
  selector:
    statefulset.kubernetes.io/pod-name: kvstore-1
  ports:
    - name: client
      port: 8082
      targetPort: 8000

---
apiVersion: v1
kind: Service
metadata:
  name: kvstore-2-client
  namespace: kvstore
spec:
  type: LoadBalancer
  selector:
    statefulset.kubernetes.io/pod-name: kvstore-2
  ports:
    - name: client
      port: 8083
      targetPort: 8000

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kvstore
  namespace: kvstore
spec:
  serviceName: kvstore-headless
  replicas: 3
  selector:
    matchLabels:
      app: kvstore
  template:
    metadata:
      labels:
        app: kvstore
    spec:
      # Makes the PVC's mounted directory writable by the distroless image's
      # uid 65532 — a freshly provisioned PVC doesn't inherit ownership from
      # the image the way a Docker named volume did.
      securityContext:
        fsGroup: 65532
      containers:
        - name: kvstored
          image: ghcr.io/dhruvgandhi31/distributed-kv-store:latest
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # Enables the dashboard's "Disconnect for 15s" button. Kept out of
            # this file on purpose; create it once on the cluster with
            #   kubectl -n kvstore create secret generic kvstore-demo --from-literal=token=<secret>
            # optional: without the Secret the dashboard is simply read-only.
            - name: KV_DEMO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: kvstore-demo
                  key: token
                  optional: true
          # $(POD_NAME) is expanded by kubelet itself, not a shell — the
          # image has none. All 3 replicas share this template, so --id is
          # the only thing that varies, and it comes from the pod's own name
          # (kvstore-0, kvstore-1, kvstore-2).
          #
          # --peers is Raft-to-Raft traffic only, never leaves the cluster,
          # so internal headless-service DNS is correct there. --client-peers
          # builds the X-Leader-URL redirect header, which external clients
          # must be able to resolve — so it uses the VM's public IP and the
          # per-pod LoadBalancer ports defined above, not internal DNS.
          # 34.60.149.77 is the VM's reserved static external IP, so it
          # survives stop/start.
          args:
            - --id=$(POD_NAME)
            - --raft-addr=0.0.0.0:7000
            - --client-addr=0.0.0.0:8000
            - --peers=kvstore-0=kvstore-0.kvstore-headless:7000,kvstore-1=kvstore-1.kvstore-headless:7000,kvstore-2=kvstore-2.kvstore-headless:7000
            - --client-peers=kvstore-0=34.60.149.77:8081,kvstore-1=34.60.149.77:8082,kvstore-2=34.60.149.77:8083
            - --data-dir=/data
            # pprof listens on the pod's loopback only, so no Service can
            # reach it. Use: kubectl -n kvstore port-forward kvstore-0 6060
            - --debug-addr=127.0.0.1:6060
          ports:
            - containerPort: 7000
              name: raft
            - containerPort: 8000
              name: client
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
