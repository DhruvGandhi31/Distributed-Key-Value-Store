services:
  node1:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile
    command:
      - --id=node1
      - --raft-addr=0.0.0.0:7000
      - --client-addr=0.0.0.0:8000
      - --peers=node1=node1:7000,node2=node2:7000,node3=node3:7000
      - --client-peers=node1=http://node1:8000,node2=http://node2:8000,node3=http://node3:8000
      - --data-dir=/data
    ports: ["8001:8000"]
    volumes: [node1-data:/data]
    networks: [kvstore]

  node2:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile
    command:
      - --id=node2
      - --raft-addr=0.0.0.0:7000
      - --client-addr=0.0.0.0:8000
      - --peers=node1=node1:7000,node2=node2:7000,node3=node3:7000
      - --client-peers=node1=http://node1:8000,node2=http://node2:8000,node3=http://node3:8000
      - --data-dir=/data
    ports: ["8002:8000"]
    volumes: [node2-data:/data]
    networks: [kvstore]

  node3:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile
    command:
      - --id=node3
      - --raft-addr=0.0.0.0:7000
      - --client-addr=0.0.0.0:8000
      - --peers=node1=node1:7000,node2=node2:7000,node3=node3:7000
      - --client-peers=node1=http://node1:8000,node2=http://node2:8000,node3=http://node3:8000
      - --data-dir=/data
    ports: ["8003:8000"]
    volumes: [node3-data:/data]
    networks: [kvstore]

volumes:
  node1-data:
  node2-data:
  node3-data:

networks:
  kvstore:
    driver: bridge
