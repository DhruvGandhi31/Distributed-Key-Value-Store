name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs: 
  build-and-test:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Set up Go
          uses: actions/setup-go@v5
          with:
            go-version: '1.21'
            check-latest: true

        - name: Check formatting (gofmt)
          run: |
            fmt_out="$(go-fmt -l .)"
            if [ -n "$fmt_out" ]; then
              echo "The following files are not gofmt'ed"
              echo "$fmt_out"
              exit 1
            fi

        - name: Vet
          if: hashFiles('go.mod') != ''
          run: go vet ./...

        - name: Test
          if: hashFiles('go.mod') != ''
          run: go test -race -timeout 120s ./...

        - name: Build
          if: hashFiles('go.mod') != ''
          run: |
            go build ./cmd/server
            go build ./cmd/client
